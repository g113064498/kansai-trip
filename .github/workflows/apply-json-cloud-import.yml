name: Apply JSON cloud import patch
on:
  push:
    branches: [main]
    paths: ['tools/patch_json_cloud_import.py']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/patch_json_cloud_import.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm tools/patch_json_cloud_import.py .github/workflows/apply-json-cloud-import.yml
          git add app.js
          git commit -m 'feat: import JSON backups into Hexschool cloud data'
          git push
