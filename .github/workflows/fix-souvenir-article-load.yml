name: Fix souvenir article loading
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-souvenir-article-load.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.js
        run: python3 tools/fix_souvenir_article_load.py
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm tools/fix_souvenir_article_load.py .github/workflows/fix-souvenir-article-load.yml
          git add app.js
          git commit -m 'fix: load full souvenir article from Hexschool'
          git push origin main
