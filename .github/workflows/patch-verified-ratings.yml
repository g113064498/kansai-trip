name: Patch verified restaurant ratings

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-verified-ratings.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch verified ratings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')

          ratings = r'''
// Verified restaurant rating snapshot (checked 2026-09-08).
// Google ratings are only filled when an exact business match returned a numeric score.
// Tabelog ratings are tied to the exact branch/page verified; ambiguous branches are intentionally left blank.
const VERIFIED_RESTAURANT_RATINGS = {
    "松屋 四條大宮站前店": { tabelogRating: "3.04", tabelogUrl: "https://tabelog.com/kyoto/A2601/A260203/26022692/" },
    "PRESS BUTTER SAND 大阪高島屋": { tabelogRating: "3.05", tabelogUrl: "https://tabelog.com/osaka/A2701/A270202/27107359/" },
    "Sugar Butter Tree 阪急梅田店": { tabelogRating: "3.21", tabelogUrl: "https://tabelog.com/osaka/A2701/A270101/27058543/" },
    "ÉCHIRÉ Marché au Beurre": { googleRating: "4.0", tabelogRating: "3.76", tabelogUrl: "https://tabelog.com/osaka/A2701/A270101/27068734/" },
    "Yasubee": { tabelogRating: "3.36", tabelogUrl: "https://tabelog.com/kyoto/A2601/A260201/26000218/" },
    "Yumemiya": { googleRating: "4.6", tabelogUrl: "https://tabelog.com/kyoto/A2601/A260101/26013597/" },
    "麵屋練之助 🍜": { tabelogRating: "3.52", tabelogUrl: "https://tabelog.com/kyoto/A2601/A260501/26039142/", ratingNote: "Tabelog目前標示此頁為移轉前資料，請出發前再確認新店址。" },
    "Mamemono and Taiyaki 🍴": { googleRating: "4.2", tabelogRating: "3.50", tabelogUrl: "https://tabelog.com/kyoto/A2601/A260403/26034817/" },
    "Sukiyaki Kimura 🍲": { tabelogRating: "3.50", tabelogUrl: "https://tabelog.com/kyoto/A2601/A260201/26000648/" },
    "GION GOZU 四条店": { googleRating: "4.5", tabelogRating: "3.20", tabelogUrl: "https://tabelog.com/kyoto/A2601/A260301/26036359/" },
    "DONGURI Shijo-Omiya Store": { googleRating: "4.2", tabelogRating: "3.09", tabelogUrl: "https://tabelog.com/kyoto/A2601/A260203/26026992/" },
    "麵屋 豬一 🍜": { tabelogRating: "3.71", tabelogUrl: "https://tabelog.com/kyoto/A2601/A260201/26032368/" },
    "お好み焼（大阪燒）千草": { tabelogRating: "3.65", tabelogUrl: "https://tabelog.com/osaka/A2701/A270103/27002204/" },
    "可樂餅 中村屋": { tabelogRating: "3.49", tabelogUrl: "https://tabelog.com/osaka/A2701/A270103/27003769/" },
    "HARBS 心齋橋Parco店": { googleRating: "4.1", tabelogRating: "3.09", tabelogUrl: "https://tabelog.com/osaka/A2701/A270201/27120494/" },
    "HARBS Namba Parks": { tabelogRating: "3.15", tabelogUrl: "https://tabelog.com/osaka/A2701/A270202/27002803/" },
    "Shabuwara 壽喜燒 涮涮鍋 花月店": { tabelogRating: "3.09", tabelogUrl: "https://tabelog.com/osaka/A2701/A270202/27101867/", ratingNote: "已核對為『しゃぶ笑 なんばグランド花月店』；原英文名稱較不精確。" },
    "Shabucho": { tabelogRating: "3.54", tabelogUrl: "https://tabelog.com/osaka/A2701/A270101/27003519/", ratingNote: "已核對最符合的是『しゃぶ亭 西梅田店』；原候選名稱 Shabucho 太模糊。" },
    "飛騨牛一頭家 馬喰一代 KITTE大阪 🥩": { tabelogRating: "3.58", tabelogUrl: "https://tabelog.com/osaka/A2701/A270101/27149584/" },
    "いかれたNOODLE Fishtons 🍜": { tabelogRating: "3.72", tabelogUrl: "https://tabelog.com/osaka/A2701/A270201/27101904/" },
    "すき焼きと牛まぶし ももしき 🥩": { tabelogRating: "3.62", tabelogUrl: "https://tabelog.com/nara/A2901/A290101/29012172/" },
    "お好み焼 美津の 🍳": { tabelogRating: "3.56", tabelogUrl: "https://tabelog.com/osaka/A2701/A270202/27001278/" },
    "Kusaka Curry Namba DINING MAISON": { googleRating: "4.7", ratingNote: "Google可確認此候選點，但Tabelog搜尋到的是心齋橋本店，為避免把本店3.54誤套到難波分店，Tabelog分數暫留白。" }
};
'''
          marker = "let currentPoolPage = 1;\n"
          if 'const VERIFIED_RESTAURANT_RATINGS' not in s:
              if marker not in s:
                  raise SystemExit('global state marker not found')
              s = s.replace(marker, marker + ratings + '\n', 1)

          merge_marker = "        db.attractionPool = [...filteredApiPoolItems, ...initialOnly];\n"
          apply_block = r'''        // Apply verified restaurant rating snapshot after API/initial merge.
        for (const item of db.attractionPool) {
            const verified = VERIFIED_RESTAURANT_RATINGS[item.title];
            if (!verified) continue;
            if (verified.googleRating) item.googleRating = verified.googleRating;
            if (verified.tabelogRating) item.tabelogRating = verified.tabelogRating;
            if (verified.tabelogUrl) item.tabelogUrl = verified.tabelogUrl;
            if (verified.ratingNote) item.ratingNote = verified.ratingNote;
            item.ratingCheckedAt = '2026-09-08';
        }
'''
          if apply_block.strip() not in s:
              if merge_marker not in s:
                  raise SystemExit('merge marker not found')
              s = s.replace(merge_marker, merge_marker + apply_block, 1)

          old = "        const tabelogUrl = `https://tabelog.com/rstLst/?sk=${encodeURIComponent(item.title)}`;"
          new = "        const tabelogUrl = item.tabelogUrl || `https://tabelog.com/rstLst/?sk=${encodeURIComponent(item.title)}`;"
          if old in s:
              s = s.replace(old, new, 1)

          old2 = "                    ${foodRatingHtml}\n"
          new2 = "                    ${foodRatingHtml}\n                    ${item.ratingNote ? `<div style=\"font-size:0.76rem;color:var(--text-muted);margin-top:6px;\">ℹ️ ${item.ratingNote}</div>` : ''}\n"
          if old2 in s and 'item.ratingNote ?' not in s:
              s = s.replace(old2, new2, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-verified-ratings.yml
          git add app.js
          git commit -m "data: add verified restaurant rating snapshot"
          git push origin main
