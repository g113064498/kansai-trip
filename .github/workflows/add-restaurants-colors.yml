name: Add restaurants and itinerary colors

on:
  push:
    paths:
      - '.github/scripts/patch_restaurants_colors.py'
      - '.github/workflows/add-restaurants-colors.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_restaurants_colors.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js style.css index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "feat: add restaurant candidates and color-coded itinerary"
          git push
