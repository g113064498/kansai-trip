name: Highlight meal placeholders

on:
  push:
    paths:
      - '.github/workflows/meal-placeholder-highlight.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch meal placeholder detection
        shell: python
        run: |
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          old = """        const div = document.createElement('div');\n        div.className = `timeline-item category-${item.category || 'other'}`;\n        \n        let categoryIcon = '📍';\n        if (item.category === 'food') categoryIcon = '🍴';\n"""
          new = """        const div = document.createElement('div');\n        const isMealItem = item.category === 'food' || /(早餐|午餐|晚餐)/.test(item.title || '');\n        const displayCategory = isMealItem ? 'food' : (item.category || 'other');\n        div.className = `timeline-item category-${displayCategory}`;\n        \n        let categoryIcon = '📍';\n        if (isMealItem) categoryIcon = '🍴';\n"""
          if old not in s:
              raise SystemExit('timeline item marker not found')
          s = s.replace(old, new, 1)
          old2 = '<div class="timeline-card timeline-card-${item.category || \'other\'} ${hasPhotos ? \'has-photo\' : \'\'}">'
          new2 = '<div class="timeline-card timeline-card-${displayCategory} ${hasPhotos ? \'has-photo\' : \'\'}">'
          if old2 not in s:
              raise SystemExit('timeline card marker not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "fix: highlight meal candidate itinerary items as food"
          git push
