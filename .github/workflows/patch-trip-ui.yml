name: One-off trip UI patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 tools/patch_trip_ui_once.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-trip-ui.yml tools/patch_trip_ui_once.py
          git add app.js index.html
          git commit -m "feat: add map links and restaurant rating fields"
          git push origin main
