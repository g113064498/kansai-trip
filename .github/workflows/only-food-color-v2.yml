name: Apply restaurant color only

on:
  push:
    paths:
      - '.github/workflows/only-food-color-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/only_food_color.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css index.html
          git commit -m "style: highlight restaurant itinerary items only"
          git push
