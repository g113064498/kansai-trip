name: Fix collaborative merge baseline
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/fix_collab_baseline.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-collab-baseline.yml tools/fix_collab_baseline.py
          git add app.js
          git commit -m "fix: keep local baseline for repeated collaborative saves"
          git push origin main
