name: Fix restaurant ratings DB
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-restaurant-ratings-db.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.js
        run: python3 tools/fix_restaurant_ratings_db.py
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm tools/fix_restaurant_ratings_db.py .github/workflows/fix-restaurant-ratings-db.yml
          git add app.js
          git commit -m 'fix: persist restaurant ratings in Hexschool products'
          git push origin main
