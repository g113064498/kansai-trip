name: Fix JSON import persistence

on:
  push:
    paths:
      - '.github/workflows/fix-json-import.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch importDataFromJSON
        shell: python
        run: |
          from pathlib import Path

          path = Path('app.js')
          text = path.read_text(encoding='utf-8')

          start_marker = '// IMPORT JSON DATA\nfunction importDataFromJSON(event) {'
          end_marker = '\n// EXPORT SELF-CONTAINED HTML'

          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate importDataFromJSON block')

          replacement = r'''// IMPORT JSON DATA
          function importDataFromJSON(event) {
              const file = event.target.files[0];
              if (!file) return;

              const reader = new FileReader();
              reader.onload = async function(e) {
                  try {
                      const parsedData = JSON.parse(e.target.result);

                      if (!(parsedData.flights && parsedData.hotels && parsedData.itinerary)) {
                          alert("匯入失敗：這似乎不是正確的日程 JSON 格式。");
                          return;
                      }

                      // Keep imported JSON as the current state.
                      // Do NOT call initApp(): it reloads cache/API and overwrites imported data.
                      db = parsedData;

                      if (!db.messages) db.messages = [];
                      if (!db.attractionPool) db.attractionPool = [];
                      if (!db.itinerary) db.itinerary = {};
                      if (!db.deletedPoolItems) db.deletedPoolItems = [];
                      if (!db.scheduledItems) db.scheduledItems = {};
                      if (!db.poolPhotos) db.poolPhotos = {};
                      if (!db.souvenirs) db.souvenirs = [];

                      saveToLocalStorage();
                      renderAllUI();

                      const loggedIn = ensureLogin();
                      if (!loggedIn) {
                          alert("行程資料已匯入到此瀏覽器。登入後再同步即可。");
                          return;
                      }

                      showSyncOverlay();
                      try {
                          await saveAllToRemote();
                          await saveSouvenirsToRemote();
                          saveToLocalStorage();
                          setSyncStatus('synced');
                          alert("行程資料已成功匯入並同步到雲端！");
                      } catch (syncErr) {
                          console.error('[Import] 雲端同步失敗:', syncErr);
                          setSyncStatus('offline');
                          alert("JSON 已匯入到此瀏覽器，但同步雲端失敗：" + syncErr.message);
                      } finally {
                          hideSyncOverlay();
                      }
                  } catch (err) {
                      alert("匯入失敗，解析 JSON 時出錯：" + err.message);
                  } finally {
                      event.target.value = '';
                  }
              };
              reader.readAsText(file);
          }
          '''

          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

      - name: Commit fix
        run: |
          if git diff --quiet -- app.js; then
            echo "No app.js changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "fix: persist imported JSON to cache and remote API"
          git push
