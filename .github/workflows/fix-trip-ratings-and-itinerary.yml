name: Fix trip data

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply repair
        run: python3 tools/fix_trip_ratings_itinerary_once.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-trip-ratings-and-itinerary.yml tools/fix_trip_ratings_itinerary_once.py
          git add app.js
          git commit -m "fix: restore itinerary and merge verified ratings into API data"
          git push origin main
